<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexIP India — Unified IPR Search Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: dark; }
        body { background-color: #111827; color: #d1d5db; }
        .table-fixed-layout { table-layout: fixed; }
        .drawer-overlay {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0; transition: opacity 0.3s ease-in-out;
            z-index: 40;
        }
        .drawer-overlay.open { opacity: 1; }
        .drawer {
            position: fixed; top: 0; bottom: 0; right: 0;
            width: 100%; max-width: 28rem; /* 448px */
            transform: translateX(100%); transition: transform 0.3s ease-in-out;
            background-color: #1f2937;
            z-index: 50;
        }
        .drawer.open { transform: translateX(0); }
        .sort-icon { opacity: 0.3; }
        .sort-icon.active { opacity: 1; }
        .animate-ping-once {
            animation: ping 1s cubic-bezier(0, 0, 0.2, 1) 1;
        }
    </style>
</head>
<body class="antialiased font-sans">
    <div id="root"></div>

    <!-- React, ReactDOM, Babel for JSX, and Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.279.0/dist/lucide-react.js"></script>

    <!-- Main React Application -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { createRoot } = ReactDOM;
        const { Search, X, FileDown, CheckCircle, Copy, ChevronsUpDown, ChevronUp, ChevronDown, Filter, RotateCcw } = lucide-react;

        const MOCK_DATA = [
            // Trademarks
            { id: 1, type: 'Trademark', title: 'TATA NEXON', reg_no: 'TM-451234', applicant: 'TATA Motors Ltd.', status: 'Registered', filing_date: '2020-05-15', nice_class: '12 (Vehicles)' },
            { id: 2, type: 'Trademark', title: 'ZOMATO', reg_no: 'TM-398765', applicant: 'Zomato Ltd.', status: 'Registered', filing_date: '2018-11-22', nice_class: '39 (Transport and storage)' },
            { id: 3, type: 'Trademark', title: 'JIO 5G', reg_no: 'TM-567890', applicant: 'Reliance Jio Infocomm Ltd.', status: 'Objected', filing_date: '2021-08-01', nice_class: '9 (Scientific apparatus)' },
            { id: 4, type: 'Trademark', title: "HALDIRAM'S", reg_no: 'TM-123456', applicant: 'Haldiram Foods International Pvt. Ltd.', status: 'Opposed', filing_date: '2019-03-12', nice_class: '29 (Meats and processed foods)' },

            // Patents
            { id: 5, type: 'Patent', title: 'Dual Fuel Injection System', reg_no: 'PAT-IN202111001', applicant: 'IIT Bombay', status: 'Granted', filing_date: '2021-01-20', ipc: 'F02D 19/06' },
            { id: 6, type: 'Patent', title: 'Cryogenic Liquid Storage Tank', reg_no: 'PAT-IN201911002', applicant: 'ISRO', status: 'Granted', filing_date: '2019-07-30', ipc: 'F17C 3/02' },
            { id: 7, type: 'Patent', title: 'Biodegradable Packaging Material', reg_no: 'PAT-IN202211003', applicant: 'CSIR', status: 'Examined', filing_date: '2022-02-18', ipc: 'B65D 65/46' },
            { id: 8, type: 'Patent', title: 'Solar Cell Interconnection Method', reg_no: 'PAT-IN202011004', applicant: 'BHEL', status: 'Refused', filing_date: '2020-09-05', ipc: 'H01L 31/05' },

            // Copyrights
            { id: 9, type: 'Copyright', title: 'Chhota Bheem Episode 102', reg_no: 'CR-C-12345', applicant: 'Green Gold Animation', status: 'Registered', filing_date: '2017-06-10', work_type: 'Cinematograph Film' },
            { id: 10, type: 'Copyright', title: 'UPI Core Switch Protocol', reg_no: 'CR-SW-54321', applicant: 'NPCI', status: 'Registered', filing_date: '2016-04-11', work_type: 'Software' },
            { id: 11, type: 'Copyright', title: 'Sholay Screenplay', reg_no: 'CR-L-67890', applicant: 'Sippy Films', status: 'Registered', filing_date: '1975-08-15', work_type: 'Literary Work' },
            { id: 12, type: 'Copyright', title: 'Ayurvedic Pharmacopeia Art', reg_no: 'CR-A-09876', applicant: 'Ministry of AYUSH', status: 'Registered', filing_date: '2021-10-25', work_type: 'Artistic Work' },

            // Geographical Indications
            { id: 13, type: 'GI', title: 'Darjeeling Tea', reg_no: 'GI-1', applicant: 'Tea Board of India', status: 'Registered', filing_date: '2003-10-27', state: 'West Bengal' },
            { id: 14, type: 'GI', title: 'Kanchipuram Silk', reg_no: 'GI-25', applicant: 'Govt. of Tamil Nadu', status: 'Registered', filing_date: '2005-09-15', state: 'Tamil Nadu' },
            { id: 15, type: 'GI', title: 'Mysore Sandal Soap', reg_no: 'GI-32', applicant: 'Karnataka Soaps & Detergents Ltd.', status: 'Registered', filing_date: '2006-03-21', state: 'Karnataka' },
            { id: 16, type: 'GI', title: 'Alphonso Mango', reg_no: 'GI-139', applicant: 'DAPOLI AGRICULTURAL UNIVERSITY', status: 'Objected', filing_date: '2008-07-02', state: 'Maharashtra' },
        ];
        
        const TYPE_COLORS = {
            Trademark: 'bg-blue-500/20 text-blue-300 border border-blue-500/30',
            Patent: 'bg-purple-500/20 text-purple-300 border border-purple-500/30',
            Copyright: 'bg-green-500/20 text-green-300 border border-green-500/30',
            GI: 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30',
        };

        const STATUS_COLORS = {
            Registered: 'bg-green-500/20 text-green-300 border border-green-500/30',
            Granted: 'bg-green-500/20 text-green-300 border border-green-500/30',
            Objected: 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30',
            Examined: 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30',
            Opposed: 'bg-red-500/20 text-red-300 border border-red-500/30',
            Refused: 'bg-red-500/20 text-red-300 border border-red-500/30',
        };
        
        const FILTERS = [
            'All', 'Trademarks', 'Patents', 'Copyrights', 'Geographical Indications'
        ];

        const STATUS_OPTIONS = [
            'All Statuses',
            'Registered/Granted',
            'Objected/Examined',
            'Opposed/Refused'
        ];
        
        // --- Components ---

        const LegalModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;

            return (
                <div 
                    className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center"
                    onClick={onClose}
                >
                    <div 
                        className="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-md text-gray-300"
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="flex justify-between items-center">
                            <h2 className="text-xl font-semibold text-white">Legal Disclaimer</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <X size={24} />
                            </button>
                        </div>
                        <p className="mt-4">
                            Informational aggregation prototype. Not an official registry search or legal advice. Cross-verify via official registries before reliance.
                        </p>
                        <button 
                            onClick={onClose}
                            className="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            Acknowledge
                        </button>
                    </div>
                </div>
            );
        };

        const DetailDrawer = ({ record, onClose, isOpen }) => {
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                if (!isOpen) {
                    setCopied(false);
                    return;
                }
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        onClose();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isOpen, onClose]);

            const copyJson = () => {
                navigator.clipboard.writeText(JSON.stringify(record, null, 2));
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const getDynamicField = () => {
                if (!record) return null;
                switch (record.type) {
                    case 'Trademark': return { label: 'Nice Class', value: record.nice_class };
                    case 'Patent': return { label: 'IPC Code', value: record.ipc };
                    case 'Copyright': return { label: 'Type of Work', value: record.work_type };
                    case 'GI': return { label: 'Geographical State', value: record.state };
                    default: return null;
                }
            };
            
            const dynamicField = getDynamicField();

            return (
                <>
                    <div className={`drawer-overlay ${isOpen ? 'open' : ''}`} onClick={onClose}></div>
                    <div className={`drawer ${isOpen ? 'open' : ''} p-6 flex flex-col text-gray-300 border-l border-gray-700`}>
                        {record ? (
                            <>
                                <div className="flex-shrink-0 flex justify-between items-start">
                                    <div>
                                        <h2 className="text-xl font-bold text-white">{record.title}</h2>
                                        <span className={`inline-block px-2 py-0.5 mt-1 text-xs font-medium rounded-full ${STATUS_COLORS[record.status]}`}>{record.status}</span>
                                    </div>
                                    <button onClick={onClose} className="p-1 rounded-full hover:bg-gray-700">
                                        <X size={24} />
                                    </button>
                                </div>
                                
                                <div className="mt-6 space-y-4 flex-grow overflow-y-auto pr-2">
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="col-span-1 text-gray-400">Applicant</div>
                                        <div className="col-span-2 font-medium text-white">{record.applicant}</div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="col-span-1 text-gray-400">Registration #</div>
                                        <div className="col-span-2 font-mono text-gray-300">{record.reg_no}</div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="col-span-1 text-gray-400">Filing Date</div>
                                        <div className="col-span-2 font-medium">{new Date(record.filing_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                                    </div>
                                    {dynamicField && (
                                        <div className="grid grid-cols-3 gap-4">
                                            <div className="col-span-1 text-gray-400">{dynamicField.label}</div>
                                            <div className="col-span-2 font-medium">{dynamicField.value}</div>
                                        </div>
                                    )}
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="col-span-1 text-gray-400">Applicant Address</div>
                                        <div className="col-span-2 text-sm italic text-gray-500">[Withheld under DPDP Act compliance rules — Phase 1 preview]</div>
                                    </div>
                                </div>

                                <div className="mt-6 flex-shrink-0 p-4 border border-dashed border-gray-600 rounded-lg bg-gray-900/50">
                                    <h3 className="font-semibold text-white">Verification Card (Phase 2 Preview)</h3>
                                    <div className="mt-3 text-sm space-y-2">
                                        <p><span className="text-gray-400">Source Registry:</span> <span className="font-mono text-gray-300">ipindia.gov.in</span></p>
                                        <p><span className="text-gray-400">Retrieved At:</span> <span className="font-mono text-gray-300">{new Date().toLocaleString('en-IN')}</span></p>
                                    </div>
                                    <button disabled className="mt-4 w-full text-center bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-md cursor-not-allowed">
                                        Verify on Source Registry (Phase 2)
                                    </button>
                                </div>

                                <div className="mt-6 flex-shrink-0">
                                    <button 
                                        onClick={copyJson}
                                        className="w-full flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500"
                                    >
                                        {copied ? <><CheckCircle size={16} className="text-green-400"/> Copied!</> : <><Copy size={16}/> Copy JSON</>}
                                    </button>
                                </div>
                            </>
                        ) : (
                            <p>No record selected.</p>
                        )}
                    </div>
                </>
            );
        };
        
        // --- App ---

        const App = () => {
            const [records] = useState(MOCK_DATA);
            const [searchTerm, setSearchTerm] = useState('');
            const [debouncedSearchTerm, setDebouncedSearchTerm] = useState('');
            const [activeTypeFilter, setActiveTypeFilter] = useState('All');
            const [statusFilter, setStatusFilter] = useState('All Statuses');
            const [sortConfig, setSortConfig] = useState({ key: 'filing_date', direction: 'descending' });
            
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);

            const searchInputRef = React.useRef(null);

            // Debounce search term
            useEffect(() => {
                const handler = setTimeout(() => {
                    setDebouncedSearchTerm(searchTerm);
                }, 200);

                return () => {
                    clearTimeout(handler);
                };
            }, [searchTerm]);

            // Global '/' key shortcut
            useEffect(() => {
                const handleKeyDown = (event) => {
                    if (event.key === '/' && event.target.tagName !== 'INPUT') {
                        event.preventDefault();
                        searchInputRef.current?.focus();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const filteredRecords = useMemo(() => {
                let filtered = [...records];

                // Filter by Type
                if (activeTypeFilter !== 'All') {
                    const typeMap = {
                        'Trademarks': 'Trademark',
                        'Patents': 'Patent',
                        'Copyrights': 'Copyright',
                        'Geographical Indications': 'GI'
                    };
                    filtered = filtered.filter(r => r.type === typeMap[activeTypeFilter]);
                }

                // Filter by Status
                if (statusFilter !== 'All Statuses') {
                    const statusMap = {
                        'Registered/Granted': ['Registered', 'Granted'],
                        'Objected/Examined': ['Objected', 'Examined'],
                        'Opposed/Refused': ['Opposed', 'Refused']
                    };
                    filtered = filtered.filter(r => statusMap[statusFilter].includes(r.status));
                }

                // Filter by Search Term
                if (debouncedSearchTerm) {
                    const lowercasedTerm = debouncedSearchTerm.toLowerCase();
                    filtered = filtered.filter(r => 
                        r.title.toLowerCase().includes(lowercasedTerm) ||
                        r.applicant.toLowerCase().includes(lowercasedTerm) ||
                        r.reg_no.toLowerCase().includes(lowercasedTerm)
                    );
                }

                return filtered;
            }, [records, debouncedSearchTerm, activeTypeFilter, statusFilter]);
            
            const sortedRecords = useMemo(() => {
                let sortableItems = [...filteredRecords];
                if (sortConfig.key) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];
                        
                        if (sortConfig.key === 'filing_date') {
                            aValue = new Date(aValue);
                            bValue = new Date(bValue);
                        }

                        if (aValue < bValue) {
                            return sortConfig.direction === 'ascending' ? -1 : 1;
                        }
                        if (aValue > bValue) {
                            return sortConfig.direction === 'ascending' ? 1 : -1;
                        }
                        return 0;
                    });
                }
                return sortableItems;
            }, [filteredRecords, sortConfig]);

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const handleRowClick = (record) => {
                setSelectedRecord(record);
                setIsDrawerOpen(true);
            };
            
            const handleCloseDrawer = () => {
                setIsDrawerOpen(false);
            };

            const resetFilters = () => {
                setSearchTerm('');
                setDebouncedSearchTerm('');
                setActiveTypeFilter('All');
                setStatusFilter('All Statuses');
                setSortConfig({ key: 'filing_date', direction: 'descending' });
            };
            
            const exportToCsv = () => {
                const headers = ['Type', 'Title/Mark', 'Registration No', 'Applicant', 'Status', 'Filing Date'];
                const rows = sortedRecords.map(r => [
                    r.type,
                    `"${r.title.replace(/"/g, '""')}"`,
                    r.reg_no,
                    `"${r.applicant.replace(/"/g, '""')}"`,
                    r.status,
                    r.filing_date
                ].join(','));
                
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `lexip_export_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
            
            const getCount = (type) => {
                if (type === 'All') return records.length;
                const typeMap = {
                    'Trademarks': 'Trademark',
                    'Patents': 'Patent',
                    'Copyrights': 'Copyright',
                    'Geographical Indications': 'GI'
                };
                return records.filter(r => r.type === typeMap[type]).length;
            };

            const SortableHeader = ({ label, sortKey }) => {
                const isSorting = sortConfig.key === sortKey;
                const Icon = isSorting ? (sortConfig.direction === 'ascending' ? ChevronUp : ChevronDown) : ChevronsUpDown;
                return (
                    <th onClick={() => requestSort(sortKey)} className="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-700/50">
                        <div className="flex items-center">
                            {label}
                            <Icon size={14} className={`ml-2 ${isSorting ? 'sort-icon active' : 'sort-icon'}`} />
                        </div>
                    </th>
                );
            };

            return (
                <div className="min-h-screen bg-gray-900 text-gray-300 p-4 sm:p-6 lg:p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-white">LexIP India — Unified IPR Search Console</h1>
                                <div className="mt-2 flex items-center gap-3">
                                    <span className="inline-block bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-semibold px-2.5 py-0.5 rounded-full">Phase 1 Prototype: Static Dataset</span>
                                </div>
                            </div>
                            <button 
                                onClick={() => setIsModalOpen(true)}
                                className="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-md text-sm whitespace-nowrap"
                            >
                                Legal Disclaimer
                            </button>
                        </header>

                        {/* Search & Filters */}
                        <div className="mt-8 p-4 bg-gray-800 border border-gray-700 rounded-lg">
                            <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                <div className="relative md:col-span-3">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Search size={20} className="text-gray-400" />
                                    </div>
                                    <input
                                        ref={searchInputRef}
                                        type="text"
                                        placeholder="Search by Title, Applicant, Reg No... (Press '/' to focus)"
                                        value={searchTerm}
                                        onChange={e => setSearchTerm(e.target.value)}
                                        className="block w-full bg-gray-900 border border-gray-600 rounded-md py-2 pl-10 pr-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    />
                                </div>
                                <div className="relative md:col-span-2">
                                     <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Filter size={20} className="text-gray-400" />
                                    </div>
                                    <select 
                                        value={statusFilter} 
                                        onChange={e => setStatusFilter(e.target.value)}
                                        className="block w-full bg-gray-900 border border-gray-600 rounded-md py-2 pl-10 pr-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none"
                                    >
                                        {STATUS_OPTIONS.map(opt => <option key={opt}>{opt}</option>)}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="mt-4 flex flex-wrap items-center gap-2">
                                {FILTERS.map(filter => (
                                    <button 
                                        key={filter}
                                        onClick={() => setActiveTypeFilter(filter)}
                                        className={`px-3 py-1 text-sm font-medium rounded-full ${activeTypeFilter === filter ? 'bg-blue-600 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'}`}
                                    >
                                        {filter} <span className="text-xs opacity-70 ml-1">{getCount(filter)}</span>
                                    </button>
                                ))}
                                <button onClick={resetFilters} className="ml-auto flex items-center gap-2 px-3 py-1 text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-700 rounded-full">
                                    <RotateCcw size={14}/> Reset Filters
                                </button>
                            </div>
                        </div>

                        {/* Results Table */}
                        <div className="mt-6 flow-root">
                            <div className="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                                <div className="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
                                    <div className="border border-gray-700 rounded-lg overflow-hidden">
                                        <div className="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                                            <h3 className="font-semibold text-white">Search Results ({sortedRecords.length} found)</h3>
                                            <button 
                                                onClick={exportToCsv}
                                                className="flex items-center gap-2 bg-green-600/80 hover:bg-green-600 text-white font-bold py-1.5 px-3 rounded-md text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                                                disabled={sortedRecords.length === 0}
                                            >
                                                <FileDown size={16}/> Export CSV
                                            </button>
                                        </div>
                                        <table className="min-w-full divide-y divide-gray-700 table-fixed-layout">
                                            <thead className="bg-gray-800">
                                                <tr>
                                                    <th className="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-32">Type</th>
                                                    <SortableHeader label="Title / Mark" sortKey="title" />
                                                    <th className="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/4">Applicant</th>
                                                    <SortableHeader label="Status" sortKey="status" />
                                                    <SortableHeader label="Filing Date" sortKey="filing_date" />
                                                    <th className="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-24">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-gray-800/50 divide-y divide-gray-700">
                                                {sortedRecords.length > 0 ? sortedRecords.map(record => (
                                                    <tr 
                                                        key={record.id} 
                                                        className="hover:bg-gray-700/50 cursor-pointer"
                                                        onClick={() => handleRowClick(record)}
                                                    >
                                                        <td className="px-4 py-4 whitespace-nowrap"><span className={`px-2 py-1 text-xs font-semibold rounded-md ${TYPE_COLORS[record.type]}`}>{record.type}</span></td>
                                                        <td className="px-4 py-4 whitespace-nowrap overflow-hidden text-ellipsis">
                                                            <div className="font-medium text-white">{record.title}</div>
                                                            <div className="text-sm text-gray-400 font-mono">{record.reg_no}</div>
                                                        </td>
                                                        <td className="px-4 py-4 whitespace-nowrap overflow-hidden text-ellipsis text-gray-300">{record.applicant}</td>
                                                        <td className="px-4 py-4 whitespace-nowrap"><span className={`px-2 py-1 text-xs font-semibold rounded-md ${STATUS_COLORS[record.status]}`}>{record.status}</span></td>
                                                        <td className="px-4 py-4 whitespace-nowrap text-gray-300">{new Date(record.filing_date).toLocaleDateString('en-CA')}</td>
                                                        <td className="px-4 py-4 whitespace-nowrap text-sm font-medium">
                                                            <a href="#" className="text-blue-400 hover:text-blue-300">View</a>
                                                        </td>
                                                    </tr>
                                                )) : (
                                                    <tr>
                                                        <td colSpan="6" className="text-center py-10 text-gray-500">
                                                            No records found. Try adjusting your search or filters.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <LegalModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} />
                    <DetailDrawer record={selectedRecord} isOpen={isDrawerOpen} onClose={handleCloseDrawer} />
                </div>
            );
        };
        
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
